name: shopflow

services:
  # ---------- Databases ----------
  postgres:
    image: postgres:16
    container_name: shopflow-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["5434:5432"]          # was 5432:5432 (clashes with local Windows Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: shopflow-mongo
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

  redis:
    image: redis:7
    container_name: shopflow-redis
    ports: ["6380:6379"]          # was 6379:6379

  # ---------- Kafka ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: shopflow-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: shopflow-kafka-ui
    ports: ["8081:8080"]          # was 8080:8080 (safer)
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  # ---------- Observability ----------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: shopflow-jaeger
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopflow-prometheus
    ports: ["9091:9090"]          # was 9090:9090
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shopflow-grafana
    ports: ["3010:3000"]

  # ---------- Email testing ----------
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: shopflow-mailpit
    ports: ["8025:8025", "1025:1025"]

  # ---------- Object storage (S3-compatible) ----------
  # MinIO no longer publishes free images (minio/minio, minio/mc are gone), so
  # this is Bitnami's archived build of the same releases (server 2024-09-22,
  # mc 2024-09-16). It runs as a non-root user and stores data in /bitnami.
  minio:
    image: bitnamilegacy/minio:2024.9.22
    container_name: shopflow-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports: ["9002:9000", "9003:9001"] # 9000 is taken locally; console on 9003
    volumes: [miniodata:/bitnami/minio/data]

  # One-time setup: bucket, public read for products/ only, and tmp/ uploads
  # that were never confirmed are deleted after 1 day.
  minio-setup:
    image: bitnamilegacy/minio:2024.9.22 # includes the mc client
    container_name: shopflow-minio-setup
    depends_on: [minio]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/shopflow-products;
      mc anonymous set download local/shopflow-products/products;
      mc ilm rule add --prefix 'tmp/' --expire-days 1 local/shopflow-products;
      exit 0;
      "

volumes:
  pgdata:
  mongodata:
  miniodata: