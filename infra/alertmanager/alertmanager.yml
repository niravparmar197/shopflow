# Alerts go to on-call by email (Mailpit locally).
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@shopflow.local
  smtp_require_tls: false

route:
  receiver: oncall-email
  group_by: [alertname, service] # 7 services down = 1 email per alert, not 700
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: oncall-email
      repeat_interval: 30m

receivers:
  - name: oncall-email
    email_configs:
      - to: oncall@shopflow.local
        send_resolved: true # also say when it's fixed
