name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Generated types are committed; fail if they no longer match the .proto.
      - name: Generate proto types
        run: |
          npm run proto:gen
          git diff --exit-code -- libs/proto/src/generated

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test -- --passWithNoTests

      # Starts a real PostgreSQL with Testcontainers (Docker is preinstalled).
      - name: Integration tests (user)
        run: npm run test:e2e:user

      # Starts real MongoDB + Redis; also exercises the gRPC contract.
      - name: Integration tests (product)
        run: npm run test:e2e:product

      # Real PostgreSQL (migrations) + Redis; the product service is faked.
      # Includes the concurrency test for the atomic cart limit.
      - name: Integration tests (order)
        run: npm run test:e2e:order

      # Real PostgreSQL + Kafka: duplicates, flash-sale oversell, deadlock,
      # poison → DLQ, retry topic. (The order suite above also runs the saga
      # against a real Kafka.)
      - name: Integration tests (inventory)
        run: npm run test:e2e:inventory

      # Real PostgreSQL + Kafka, fake provider: signed webhooks + dedupe,
      # webhook vs timeout race ×20, auto-refund, circuit breaker, compensation.
      - name: Integration tests (payment)
        run: npm run test:e2e:payment

      - name: Build all services
        run: |
          for app in gateway user product order payment inventory notification; do
            npx nest build $app
          done